<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Mistrza</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a252f; color: white; text-align: center; margin: 0; }
        h1 { font-size: 3rem; margin-top: 20px; color: #f1c40f; }
        #qr-container { background: white; display: inline-block; padding: 20px; border-radius: 15px; margin: 20px auto; }
        #qrcode { padding: 10px; }
        #liveList { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 20px; max-height: 50vh; overflow-y: auto; }
        .student-badge { background: #34495e; padding: 15px 25px; border-radius: 50px; font-size: 1.8rem; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        #top3-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #2c3e50, #000); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .winner { font-size: 4rem; margin: 15px; text-shadow: 0 0 20px rgba(241, 196, 15, 0.8); }
        .rank-1 { color: #f1c40f; font-size: 5rem; } .rank-2 { color: #bdc3c7; font-size: 4rem; } .rank-3 { color: #cd7f32; font-size: 3.5rem; }
        .controls { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; }
        button { padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 8px; cursor: pointer; }
        .btn-top3 { background: #27ae60; color: white; font-weight: bold; }
        .btn-reset { background: #e74c3c; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="setup-view">
        <h1>Zeskanuj, aby zacząć!</h1>
        <div id="qr-container">
            <div id="qrcode"></div>
        </div>
        <p style="font-size: 1.5rem;">Użyj telefonu/tabletu</p>
    </div>

    <div id="main-view" class="hidden">
        <h1>Aktywni Uczniowie</h1>
        <div id="liveList"><p>Czekam na graczy...</p></div>
        <div class="controls">
            <button class="btn-top3" onclick="showTop3()">🏆 OGŁOŚ TOP 3</button>
            <button class="btn-reset" onclick="resetAll()">🔄 RESETUJ</button>
        </div>
    </div>

    <div id="top3-screen">
        <h1>🏆 NAJLEPSI W QUIZIE 🏆</h1>
        <div id="top3-list"></div>
        <br>
        <button onclick="closeTop3()" style="background: #7f8c8d; color: white;">Powrót</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        console.log("Socket.io połączone.");

        async function generateQR() {
            console.log("Rozpoczynam generowanie QR...");
            const qrElement = document.getElementById("qrcode");
            if (!qrElement) {
                console.error("Nie znaleziono elementu #qrcode!");
                return;
            }

            try {
                console.log("Pobieranie konfiguracji z /api/config...");
                const response = await fetch('/api/config');
                if (!response.ok) throw new Error("Błąd serwera: " + response.status);

                const config = await response.json();
                console.log("Konfiguracja pobrana:", config);

                const studentUrl = `http://${config.ip}:${config.port}/index.html`;
                console.log("Generowanie QR dla:", studentUrl);

                new QRCode(qrElement, {
                    text: studentUrl,
                    width: 300,
                    height: 300
                });
                console.log("QR Kod wygenerowany pomyślnie!");
            } catch (err) {
                console.error("BŁĄD GENEROWANIA QR:", err);
                const fallbackUrl = window.location.origin + '/index.html';
                console.log("Używam fallback URL:", fallbackUrl);
                new QRCode(qrElement, {
                    text: fallbackUrl,
                    width: 300,
                    height: 300
                });
            }
        }

        window.addEventListener('load', () => {
            console.log("Okno załadowane.");
            generateQR();
        });

        socket.on('updateTeacherList', (results) => {
            console.log("Aktualizacja listy uczniów:", results);
            if(results.length > 0) {
                document.getElementById('setup-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
            } else {
                document.getElementById('main-view').classList.add('hidden');
                document.getElementById('setup-view').classList.remove('hidden');
            }

            const liveListDiv = document.getElementById('liveList');
            liveListDiv.innerHTML = '';
            results.forEach(r => {
                const div = document.createElement('div');
                div.className = 'student-badge';
                div.innerText = `${r.name} (${r.score} pkt)`;
                liveListDiv.appendChild(div);
            });
        });

        function showTop3() { socket.emit('getTop3'); }
        socket.on('showTop3', (top3) => {
            const top3ListDiv = document.getElementById('top3-list');
            top3ListDiv.innerHTML = '';
            if(top3.length === 0) { top3ListDiv.innerHTML = '<h2>Brak wyników!</h2>'; }
            else {
                top3.forEach((w, i) => {
                    const div = document.createElement('div');
                    let rc = (i===0?'rank-1':(i===1?'rank-2':'rank-3'));
                    div.className = `winner ${rc}`;
                    div.innerText = `${i+1}. ${w.name} (${w.score} pkt)`;
                    top3ListDiv.appendChild(div);
                });
            }
            document.getElementById('top3-screen').style.display = 'flex';
        });

        function closeTop3() { document.getElementById('top3-screen').style.display = 'none'; }
        function resetAll() { if(confirm("Resetować?")) { socket.emit('resetQuiz'); location.reload(); } }
    </script>
</body>
</html>
